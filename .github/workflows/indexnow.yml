# After each push to main, notify Bing IndexNow about changed HTML pages.
# Waits briefly so Cloudflare Pages can publish the verification key + pages first.

name: IndexNow (Bing)

on:
  push:
    branches: [main]
    paths:
      - "**/index.html"
      - "index.html"
      - "sitemap.xml"
      - "*.txt"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Wait for Cloudflare Pages deploy
        run: sleep 90

      - name: Submit changed URLs to Bing IndexNow
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push or missing before SHA — submitting sitemap"
            python3 scripts/indexnow.py --sitemap
            exit 0
          fi

          # Collect URLs from changed HTML; if none but key/sitemap changed, submit sitemap
          CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" || true)
          if echo "$CHANGED" | grep -E '(^|/)index\.html$|^sitemap\.xml$' >/dev/null; then
            python3 scripts/indexnow.py --git-diff "$BEFORE" "$AFTER"
          elif echo "$CHANGED" | grep -E '\.txt$' >/dev/null; then
            echo "Key/verification file changed — submitting full sitemap"
            python3 scripts/indexnow.py --sitemap
          else
            echo "No HTML pages to submit"
          fi
